name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Coletar métricas do repositório"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir site estático
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir endereços públicos
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/"
          else
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/"
          fi
          echo "NEXT_PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"

      - name: Construir o painel
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
