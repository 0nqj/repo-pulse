name: Coletar métricas do repositório

on:
  schedule:
    - cron: "7 14-21 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-pulse-metrics
  cancel-in-progress: false

jobs:
  collect:
    name: Registrar leitura transparente
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Coletar métricas verificáveis
        run: npm run collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar a nova leitura
        shell: bash
        run: |
          if git diff --quiet -- public/data/snapshots.json; then
            echo "Nenhuma leitura nova para registrar."
            exit 0
          fi

          local_time="$(TZ=America/Sao_Paulo date +'%H:%M')"
          local_date="$(TZ=America/Sao_Paulo date +'%d/%m/%Y')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshots.json
          git commit \
            -m "chore(metrics): record ${local_time} repository snapshot [bot]" \
            -m "Automated GitHub API telemetry collected on ${local_date}. Source and bot authorship are intentionally explicit."
          git push
